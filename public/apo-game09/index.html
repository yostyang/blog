<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<base href="/apo-game09/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#110d0b">
<style>html{color-scheme:dark}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>恶龙锻刀铺</title>
<meta name="description" content="恶龙锻刀铺：第一人称 3D 锻刀小游戏。点屏幕敲刀，锻出 120 种刀、树枝、铲子和八爪鱼之剑，喂饱窗外的恶龙。">
<style>@font-face{font-family:"Ma Shan Zheng";src:url("fonts/MaShanZheng-game.woff2") format("woff2");font-display:swap}</style>
<style>
/* Layout: full-bleed first-person 3D smithy at night. Iron plaques pinned to the corners (stats left, dragon's demand right), tool tabs along the bottom, drawers on the right (bottom sheet on phones). Single dark look by choice. */
:root{
  --soot:#110d0b; --iron:#1d1714; --iron-2:#2a211c; --seam:#4a3a30;
  --ember:#ff7a1a; --gold:#ffd06e; --blood:#d43a2f; --steel:#c4cbd0;
  --text:#f2e6d6; --muted:#a99688; --ok:#86d872; --bad:#ff8a7a;
  --f-brush:"Ma Shan Zheng","STKaiti","KaiTi","Kaiti SC",serif;
  --f-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--soot);color:var(--text);font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* HUD */
.hud{position:fixed;z-index:5;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:calc(100% - 260px);pointer-events:none}
.chip{background:rgba(18,13,11,.8);border:1px solid var(--seam);border-radius:6px;padding:6px 10px;font-size:13px;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .k{color:var(--muted);font-size:12px}
.chip b{color:var(--gold);font-weight:600}
.chip.day{font-family:var(--f-brush);font-size:22px;line-height:1;padding:5px 12px;color:var(--gold)}
.pips{display:inline-flex;gap:3px}
.pips i{font-style:normal;display:inline-block}
.pips .sta{width:9px;height:9px;border-radius:2px;background:var(--ember);box-shadow:0 0 6px rgba(255,122,26,.6)}
.pips .sta.off,.pips i.off.sta{background:#3a2d25;box-shadow:none}
.pips .hp{color:#ff5a4a;font-size:14px;line-height:1}
.pips .hp.off{color:#3d2b26}
#mute{pointer-events:auto}

#dragonCard{position:fixed;z-index:5;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:220px;cursor:pointer;background:linear-gradient(180deg,#2b1410,#170c0a);border:1px solid #6e2b22;border-radius:8px;padding:10px 12px;box-shadow:0 0 30px rgba(212,58,47,.2);text-align:left}
#dragonCard:hover{border-color:#a3392c}
.dc-k{font-size:11px;letter-spacing:.1em;color:#ec9384}
.dc-v{font-family:var(--f-brush);font-size:30px;color:var(--gold);line-height:1.1;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.dc-v.small{font-size:22px;color:var(--steel)}
.dc-due{font-size:12px;color:var(--muted)}
.dc-due.urgent{color:var(--bad);font-weight:700;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}

#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,230,200,.7);box-shadow:0 0 0 2px rgba(0,0,0,.35);z-index:3;pointer-events:none}
#hint{position:fixed;z-index:4;pointer-events:none;background:rgba(18,13,11,.9);border:1px solid var(--seam);border-radius:5px;padding:4px 8px;font-size:12px;transform:translate(14px,14px);white-space:nowrap}

/* bottom tabs */
#bar{position:fixed;z-index:6;left:0;right:0;margin-inline:auto;width:max-content;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;max-width:calc(100% - 24px);overflow-x:auto;padding:2px;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:64px;padding:7px 12px 6px;background:linear-gradient(180deg,#2c231e,#1a1411);border:1px solid var(--seam);border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,220,180,.07)}
.tab span{font-family:var(--f-brush);font-size:20px;line-height:1.1}
.tab small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab:hover{border-color:#7a5a44}
.tab.dim span{color:#8d7c70}
body.locked #bar{opacity:.35;pointer-events:none}

/* panel */
#panel{position:fixed;z-index:8;top:calc(128px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));width:min(410px,calc(100% - 24px));background:rgba(21,16,13,.95);border:1px solid var(--seam);border-radius:10px;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.p-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--seam)}
.p-title{font-family:var(--f-brush);font-size:28px;line-height:1.1;color:var(--gold)}
.p-x{background:none;border:1px solid var(--seam);border-radius:6px;width:34px;height:34px;font-size:18px;line-height:1;color:var(--muted)}
.p-body{overflow-y:auto;padding:12px 14px 16px;display:flex;flex-direction:column;gap:10px;min-height:0;-webkit-user-select:text;user-select:text}
.note{font-size:13px;color:var(--muted);line-height:1.6;margin:0}
.note b{color:var(--text)}
.sec{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:6px 0 -2px}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stats .chip{font-size:12px}

.sw{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:9px 10px;background:var(--iron);border:1px solid #33281f;border-radius:8px}
.sw.focus{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.sw.weak{opacity:.5}
.sw-ic{width:40px;height:40px;border-radius:6px;background:#140f0c;display:grid;place-items:center;color:var(--c)}
.sw-ic svg{width:30px;height:30px;filter:drop-shadow(0 0 4px var(--c))}
.sw-main{min-width:0}
.sw-name{font-family:var(--f-brush);font-size:20px;line-height:1.15}
.sw-name .lv{font-family:var(--f-body);font-size:12px;color:var(--gold);margin-left:4px;font-variant-numeric:tabular-nums}
.sw-meta{font-size:12px;color:var(--muted);margin-top:2px}
.sw-val{font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums;margin-top:2px}
.sw-act{display:flex;flex-direction:column;gap:4px;align-items:stretch}

.btn{border:1px solid #9c4a12;background:linear-gradient(180deg,#ff9136,#d9560e);color:#1d0d03;font-weight:700;border-radius:7px;padding:7px 12px;font-size:13px;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--iron-2);border-color:var(--seam);color:var(--text);font-weight:500}
.btn.red{background:linear-gradient(180deg,#e2503f,#a82519);border-color:#6e1a12;color:#fff}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.btn.big{font-size:16px;padding:11px 18px}
.btn small{display:block;font-weight:500;font-size:11px;opacity:.8}
.row{display:flex;gap:8px;flex-wrap:wrap}

.shop{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 10px;background:var(--iron);border:1px solid #33281f;border-radius:8px}
.shop .nm{font-size:14px;font-weight:600}
.shop .ds{font-size:12px;color:var(--muted);margin-top:2px}

.result{text-align:center;padding:6px 0 4px;display:flex;flex-direction:column;gap:6px;align-items:center}
.result .big{font-family:var(--f-brush);font-size:40px;line-height:1.1}
.result .lvline{font-size:15px;font-variant-numeric:tabular-nums}
.result .lvline b{color:var(--gold);font-size:20px}
.result .evo{font-family:var(--f-brush);font-size:26px}
.stars{display:flex;gap:12px;justify-content:center;font-size:12px;color:var(--muted)}
.stars b{color:var(--gold);font-weight:600}
.g0{color:var(--muted)} .g1{color:var(--text)} .g2{color:#ffd06e} .g3{color:#ffb14a} .g4{color:#fff1b0;text-shadow:0 0 18px #ffb14a}

.cx{display:grid;grid-template-columns:54px repeat(5,1fr);gap:4px}
.cx-path{font-family:var(--f-brush);font-size:18px;color:var(--c);display:flex;align-items:center}
.cx-cell{background:#160f0c;border:1px solid #2e241d;border-radius:5px;padding:5px 3px;text-align:center;min-width:0}
.cx-cell span{display:block;font-size:12px;color:#5d5047;line-height:1.3;word-break:break-all}
.cx-cell small{font-size:10px;color:#5d5047}
.cx-cell.got{border-color:color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 10%,#160f0c)}
.cx-cell.got span{color:var(--c);font-family:var(--f-brush);font-size:15px}

/* minigame */
#mini{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px));background:rgba(18,13,11,.92);border:1px solid var(--seam);border-radius:12px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.mini-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mini-head .t{font-family:var(--f-brush);font-size:26px;color:var(--gold)}
.mini-head .s{font-size:12px;color:var(--muted)}
.gauge,.track{position:relative;height:30px;border-radius:15px;overflow:hidden;border:1px solid #000}
.gauge{background:linear-gradient(90deg,#24100b,#6e170b 30%,#c9400e 55%,#ff9a2e 74%,#ffe6a0 88%,#fff 100%)}
.track{background:linear-gradient(180deg,#3a4046,#24282c);box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.zone{position:absolute;top:0;bottom:0;border:2px solid rgba(255,255,255,.9);border-radius:7px;box-sizing:border-box}
.track .zone{background:rgba(134,216,114,.28);border-color:var(--ok)}
.perf{position:absolute;top:0;bottom:0;background:rgba(255,214,90,.6)}
.needle{position:absolute;top:2px;bottom:2px;width:5px;margin-left:-2.5px;background:#fff;border-radius:3px;box-shadow:0 0 10px #fff,0 0 2px #000}
.strikes{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.strikes i{width:14px;height:14px;border-radius:50%;border:1px solid var(--seam);background:#140f0c}
.strikes i.s0{background:#5a3a30}.strikes i.s1{background:var(--ok)}.strikes i.s2{background:var(--gold);box-shadow:0 0 8px var(--gold)}
#miniBtn{width:100%}
#pop{position:fixed;z-index:9;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;font-family:var(--f-brush);font-size:56px;white-space:nowrap;text-shadow:0 4px 20px rgba(0,0,0,.8)}
#pop.show{animation:pop .8s ease-out forwards}
#pop.gold{color:var(--gold)} #pop.ok{color:var(--ok)} #pop.bad{color:var(--bad)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}70%{opacity:1;transform:translate(-50%,-60%) scale(1)}100%{opacity:0;transform:translate(-50%,-75%) scale(1)}}

#toasts{position:fixed;z-index:9;left:50%;transform:translateX(-50%);top:calc(132px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(440px,calc(100% - 24px))}
.toast{background:rgba(18,13,11,.94);border:1px solid var(--seam);border-radius:7px;padding:8px 12px;font-size:13px;text-align:center;transition:opacity .4s,transform .4s}
.toast.good{border-color:#6b5420;color:var(--gold)} .toast.bad{border-color:#6e2b22;color:var(--bad)}
.toast.out{opacity:0;transform:translateY(-6px)}

#flash{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle at 50% 40%,rgba(255,150,40,.75),rgba(200,30,10,.6) 60%,rgba(80,0,0,.7));opacity:0;transition:opacity .5s}
#flash.on{opacity:1;transition:opacity .15s}

/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(ellipse at 50% 30%,rgba(60,20,10,.55),rgba(8,5,4,.92) 70%);overflow-y:auto;box-sizing:border-box}
.ov-card{max-width:520px;width:100%;display:flex;flex-direction:column;gap:14px;margin:auto}
.ov h1{font-family:var(--f-brush);font-weight:400;font-size:clamp(48px,12vw,84px);line-height:1;margin:0;color:var(--gold);text-shadow:0 0 30px rgba(255,122,26,.45);text-wrap:balance}
.ov .lead{font-size:15px;color:var(--text);line-height:1.7;margin:0}
.ov ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.6;color:#dccfbf}
.ov ul b{color:var(--gold);font-weight:600}
.ov .keys{font-size:12px;color:var(--muted)}
#night{position:fixed;inset:0;z-index:15;background:#030203;display:flex;align-items:center;justify-content:center;text-align:center;opacity:0;pointer-events:none;transition:opacity .7s;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#night.on{opacity:1;pointer-events:auto}
#night .nd{font-family:var(--f-brush);font-size:64px;color:var(--gold);margin-bottom:10px}
#night p{margin:6px auto;max-width:440px;font-size:14px;line-height:1.6;color:#dccfbf}
#night p.bad{color:var(--bad)}
#nightBtn{margin-top:16px}

/* saves */
.slot{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 10px;background:var(--iron);border:1px solid #33281f;border-radius:8px}
.slot .no{font-family:var(--f-brush);font-size:24px;color:var(--gold);width:28px;text-align:center}
.slot .info{min-width:0;font-size:12px;color:var(--muted);line-height:1.5}
.slot .info b{display:block;font-size:14px;color:var(--text);font-weight:600}
.slot .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.savestat{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);padding:8px 10px;border:1px dashed var(--seam);border-radius:8px}
.savestat .dot{width:8px;height:8px;border-radius:50%;background:#6b5a4e;flex:none}
.savestat.on .dot{background:var(--ok);box-shadow:0 0 6px var(--ok)}
textarea.code{width:100%;box-sizing:border-box;min-height:70px;resize:vertical;background:#0e0a08;color:var(--text);border:1px solid var(--seam);border-radius:7px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
@media (max-width:720px){
  .hud{max-width:calc(100% - 190px);gap:4px}
  .chip{padding:5px 7px;font-size:12px}
  .chip.day{font-size:19px}
  #dragonCard{width:164px;padding:8px 10px}
  .dc-v{font-size:22px}
  #panel{top:auto;left:calc(12px + env(safe-area-inset-left,0px));width:auto;bottom:calc(78px + env(safe-area-inset-bottom,0px));max-height:58vh}
  .tab{min-width:54px;padding:6px 9px 5px}
  .tab span{font-size:18px}
  #pop{font-size:42px}
  #hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="三维锻刀铺"></canvas>
<div id="cross"></div>
<div id="hint" hidden></div>
<div id="flash"></div>

<div class="hud">
  <div class="chip day" id="hDay">第 1 天</div>
  <div class="chip"><span class="k">金币</span><b id="hGold">0</b></div>
  <div class="chip"><span class="k">炭</span><b id="hCoal">0</b></div>
  <div class="chip"><span class="k">生命</span><span class="pips" id="hHp"></span></div>
  <div class="chip" id="hSaved" hidden><span class="k">自动存档</span><b id="hSavedT"></b></div>
  <div class="chip" id="hHeld" hidden><span class="k">手上</span><b id="hHeldN"></b></div>
  <button class="chip" id="mute" type="button">声音 开</button>
</div>

<button id="dragonCard" type="button"></button>

<nav id="bar">
  <button class="tab" type="button" data-go="forge"><span>火炉</span><small>锻刀</small></button>
  <button class="tab" type="button" data-go="rack"><span>刀架</span><small id="tRack">0/12</small></button>
  <button class="tab" type="button" data-go="dragon"><span>恶龙</span><small>献刀</small></button>
  <button class="tab" type="button" data-go="merchant"><span>商人</span><small id="tMer">-</small></button>
  <button class="tab" type="button" data-go="bed"><span>睡觉</span><small>过一天</small></button>
  <button class="tab" type="button" data-go="codex"><span>图鉴</span><small id="tCodex">0/120</small></button>
  <button class="tab" type="button" data-go="saves"><span>存档</span><small id="tSave">本机</small></button>
</nav>

<section id="panel" hidden>
  <div class="p-head"><div class="p-title" id="pTitle"></div><button class="p-x" type="button" data-act="close" aria-label="关闭">×</button></div>
  <div class="p-body" id="pBody"></div>
</section>

<div id="mini" hidden>
  <div class="mini-head"><span class="t" id="miniT">火候</span><span class="s" id="miniS"></span></div>
  <button class="btn big" id="miniBtn" type="button">收刀（不敲了）</button>
</div>
<div id="pop"></div>
<div id="toasts"></div>

<div id="night"><div><div id="nightText"></div><button class="btn big" id="nightBtn" type="button">起床</button></div></div>

<div class="ov" id="ov">
  <div class="ov-card" id="ovCard"></div>
</div>

<script src="lib/three.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ================= 数据 ================= */
const CAP=990099e8;          // 刀的最高价值 990099亿
const DRAGON_MAX=8e8;        // 恶龙最高要价 8亿
const RACK_MAX=20, RACK_SLOTS=12;
const PATHS=[
  {name:'烈焰',color:0xff5a1f,css:'#ff7a3a',mult:1.00,forms:['火星刀','赤焰刀','熔岩战刀','炎龙斩','焚天·赤霄'],god:'赤霄神刀',legend:'用太阳的火心锻成，一挥能烧穿云层'},
  {name:'寒冰',color:0x6fd3ff,css:'#7fd8ff',mult:1.05,forms:['霜刃','冰晶刀','雪暴战刀','玄冰斩','永冻·玄冥'],god:'玄冥神刀',legend:'刀身里封着一整座冰川，碰到的东西都会冻住'},
  {name:'雷霆',color:0xffe14d,css:'#ffe45e',mult:1.10,forms:['电光刀','雷鸣刀','霹雳战刀','风暴斩','惊雷·破军'],god:'破军神刀',legend:'劈下去会落九道雷，连恶龙都怕它'},

let AC=null,master=null,muted=false,nb=null;
function audio(){
  if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);}catch(e){AC=null;} }
  if(AC&&AC.state==='suspended') AC.resume();
}
function noiseBuf(){ if(nb) return nb; nb=AC.createBuffer(1,AC.sampleRate*1.5,AC.sampleRate); const d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return nb; }
function tone(f,dur,type,vol,delay,slide){
  if(!AC||muted) return; const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+dur);
  g.gain.setValueAtTime(vol||.2,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.05);
}
function noise(dur,vol,freq,type,delay){
  if(!AC||muted) return; const t=AC.currentTime+(delay||0);
  const s=AC.createBufferSource(); s.buffer=noiseBuf(); const f=AC.createBiquadFilter(); f.type=type||'lowpass'; f.frequency.value=freq||1000;
  const g=AC.createGain(); g.gain.setValueAtTime(vol||.2,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+dur+.05);
}

function makePS(n,color,size,grav){
  const g=new THREE.BufferGeometry(); const pos=new Float32Array(n*3).fill(9999);
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const pts=new THREE.Points(g,new THREE.PointsMaterial({color,size,map:dotTex,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,toneMapped:false}));
  pts.frustumCulled=false; scene.add(pts);
  return {g,pos,vel:new Float32Array(n*3),life:new Float32Array(n),n,i:0,grav};
}
function emit(ps,x,y,z,vx,vy,vz,life){ const i=ps.i; ps.i=(i+1)%ps.n; ps.pos.set([x,y,z],i*3); ps.vel.set([vx,vy,vz],i*3); ps.life[i]=life; }
function stepPS(ps,dt){
  for(let i=0;i<ps.n;i++){ if(ps.life[i]<=0) continue; ps.life[i]-=dt; const k=i*3;
    ps.vel[k+1]-=ps.grav*dt; ps.pos[k]+=ps.vel[k]*dt; ps.pos[k+1]+=ps.vel[k+1]*dt; ps.pos[k+2]+=ps.vel[k+2]*dt;
    if(ps.life[i]<=0){ ps.pos[k]=ps.pos[k+1]=ps.pos[k+2]=9999; } }
  ps.g.attributes.position.needsUpdate=true;
}

const geoCache={};
function bladeShape(kind,len,w){
  const s=new THREE.Shape(), hw=w/2, P=(pts)=>{ s.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) s.lineTo(pts[i][0],pts[i][1]); s.closePath(); };

    for(let i=0;i<=N;i++){ const t=i/N*.93, wv=Math.sin(t*Math.PI*4.2)*w*.13, ww=hw*(1-t*.6); R.push([ww+wv,len*t]); L.push([-ww+wv,len*t]); }

    P([[-hw,0],[hw,0],[hw*.95,len*.5],[hw*1.25,len*.58],[hw*.85,len*.66],[hw*.9,len*.8],[0,len],[-hw*.9,len*.8],[-hw*.85,len*.66],[-hw*1.25,len*.58],[-hw*.95,len*.5]]);
  } else if(kind===2){ // 雷霆：闪电折刃
    P([[-hw,0],[hw,0],[hw*1.3,len*.2],[hw*.55,len*.34],[hw*1.2,len*.5],[hw*.45,len*.64],[hw*.95,len*.78],[0,len],[-hw*.6,len*.8],[-hw*1.05,len*.66],[-hw*.4,len*.52],[-hw*1.15,len*.36],[-hw*.5,len*.2]]);
  } else if(kind===3){ // 剧毒：弯月锯齿刃
    for(let i=0;i<=N;i++){ const t=i/N, c=t*t*w*1.2, ww=hw*(1-t*.55); R.push([c+ww*(i%2&&i<N?1.3:1),len*t*.95]); L.push([c-ww,len*t*.95]); }
    P([...R,[w*1.25,len],...L.reverse()]);
  } else if(kind===4){ // 圣光：宽身长剑
    const b=hw*1.35; P([[-b,0],[b,0],[b*1.12,len*.12],[b*.95,len*.8],[0,len],[-b*.95,len*.8],[-b*1.12,len*.12]]);
  } else if(kind===5){ // 暗影：反曲钩刃
    for(let i=0;i<=N;i++){ const t=i/N*.84, c=-t*t*w*1.1, ww=hw*(1-t*.35); R.push([c+ww,len*t]); L.push([c-ww*.9,len*t]); }
    const c1=-w*.78; P([...R,[c1+hw*.15,len*.88],[c1+hw*1.1,len*.9],[c1-hw*.2,len],...L.reverse()]);
  } else { // 普通刀
    s.moveTo(-w*.45,0); s.lineTo(w*.55,0); s.quadraticCurveTo(w*.8,len*.65,-w*.2,len); s.quadraticCurveTo(-w*.55,len*.6,-w*.45,0);

}

function refreshRack(){

  const rackList=S.swords.filter(onRack);
  if(rackList.length>RACK_SLOTS){ rackList.slice(RACK_SLOTS).forEach((sw,i)=>{ sw.loc='ground'; sw.gx=5.2-(i%3)*.7; sw.gz=-3.6+Math.floor(i/3)*1.1; sw.gr=Math.PI/2+(Math.random()-.5)*.6; }); save(); }
  const hands=S.swords.filter(s=>s.loc==='hand'); hands.slice(1).forEach(s=>{ s.loc='rack'; });
  const vis=s=>!(forge&&forge.id===s.id);
  S.swords.filter(s=>s.loc==='ground'&&vis(s)).forEach(sw=>{
    const m=buildSword(sw); const r=sw.gr||0;
    orient(m,new THREE.Vector3(Math.cos(r),0,Math.sin(r)),new THREE.Vector3(0,1,0));
    m.position.set(sw.gx||0,.07,sw.gz||0);
    tag(m,'item',`点一下拿起「${swordName(sw)}」`,{swordId:sw.id}); groundG.add(m);
  });
  const h=heldSword();
  if(h&&vis(h)){ const m=buildSword(h); const L=m.userData.len; const k=.62; m.scale.setScalar(k);
    m.rotation.set(-.55,-.15,-.28); m.position.set(.36,-.5,-.85-Math.max(0,L-1.3)*.28); handG.add(m); }
  updHeld();
  S.swords.filter(s=>onRack(s)&&vis(s)).slice(0,RACK_SLOTS).forEach((sw,i)=>{
    const row=Math.floor(i/6), col=i%6;
    const m=buildSword(sw); m.scale.setScalar(Math.min(.9,1.55/m.userData.len));
    orient(m,new THREE.Vector3(0,1,0),new THREE.Vector3(-1,0,0));

let tw=null;

  const st=ST[name]; const p=new THREE.Vector3(...st.p); const a=angles(p,new THREE.Vector3(...st.t));

function pick(cx,cy){
  ndc.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1); ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(interact,true);
  const holding=!!heldSword();
  for(const h of hits){ if(h.distance>14) break; const u=h.object.userData; if(!visibleChain(h.object)||!u.station) continue; if(u.station==='floor'&&!holding) continue; return Object.assign({},u,{point:h.point}); }

}
let pDown=null; const mouse={x:0,y:0,has:false};
canvas.addEventListener('pointerdown',e=>{ audio(); if(forge&&forge.phase==='hammer'){ e.preventDefault(); strike(); pDown=null; return; } pDown={x:e.clientX,y:e.clientY,moved:0,id:e.pointerId}; try{canvas.setPointerCapture(e.pointerId);}catch(_){} });
canvas.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'){ mouse.x=e.clientX; mouse.y=e.clientY; mouse.has=true; }
  if(pDown&&pDown.id===e.pointerId){ const dx=e.clientX-pDown.x, dy=e.clientY-pDown.y; pDown.moved+=Math.abs(dx)+Math.abs(dy); pDown.x=e.clientX; pDown.y=e.clientY;
    if(!locked&&pDown.moved>5){ if(tw&&!tw.cb) tw=null; if(!tw){ yaw-=dx*.0045; pitch=clamp(pitch-dy*.0045,-1.25,1.25);} } }
});

function clickAt(x,y){
  if(forge) return;
  if(locked) return;
  const u=pick(x,y); if(!u) return;
  const h=heldSword();
  if(u.swordId){ pickUp(u.swordId); return; }
  if(u.station==='floor'){ if(h) dropAt(u.point); return; }
  if(h&&u.station==='rack'){ putBack(); return; }
  if(h&&(u.station==='furnace'||u.station==='anvil')){ startForge(h.id); return; }
  act(u.station);
}
function act(st){
  if(locked) return;
  if(st==='furnace'||st==='anvil'||st==='forge'){ goTo('furnace'); openForgePicker(); }
  else if(st==='rack'){ goTo('rack'); openRack(); }
  else if(st==='dragon'){ goTo('dragon'); openDragon(); }
  else if(st==='merchant'){ if(isMerchantDay()){ goTo('merchant'); openMerchant(); } else toast(`商人还没来，第 ${nextMerchantDay()} 天会来`); }
  else if(st==='bed'){ goTo('bed'); openSleep(); }
  else if(st==='coal'){ toast(`炭堆里有 ${S.coal} 块炭`); }
  else if(st==='codex'){ openCodex(); }
  else if(st==='saves'){ openSaves(); }
}

function strike(){
  if(!forge||forge.phase!=='hammer'||forge.cool>0) return;
  const sw=forge.sw;
  if(sw.lv>=30){ toast('已经是神刀了，收刀吧'); return; }
  hamSwing=0; forge.hits++;
  if(forge.dmg>=BREAK_AT){ shatter(); return; }
  const o=odds(sw), r=Math.random(), stB=stageOf(sw.lv), before=sw.lv;
  let kind, add;
  if(r<o.great){ kind=2; sw.lv=greatTarget(sw.lv); add=0; }
  else if(r<o.great+o.succ){ kind=1; sw.lv++; add=Math.max(1,3+rnd(4)+Math.max(0,BASES[bOf(sw)].dmg)); }
  else { kind=0; add=Math.max(4,10+rnd(7)+Math.floor(sw.lv/5)+BASES[bOf(sw)].dmg); }
  forge.dmg+=add;
  let evolved=false;
  if(kind>0){
    sw.old=false; sw.known=true;
    const stA=stageOf(sw.lv); evolved=stA>stB;
    markCodex(sw);
    if(evolved||sw.lv>=30) forge.evos.push(swordName(sw));
    S.best=Math.max(S.best,sw.lv);
    setForgeMesh(sw); placeOnAnvil();
  }
  forge.temp=Math.max(forge.temp,kind===2?1:.7);
  forge.cool=forge.dmg>=BREAK_AT?.9:.28;
  save();
  setTimeout(()=>{
    SFX.clang(kind); if(kind===2) SFX.level(); else if(evolved) SFX.level();
    const n=[10,24,70][kind];
    for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=1+Math.random()*3*(kind+1)/2; emit(sparks,-1.1,1.16,-1.6,Math.cos(a)*sp,1.5+Math.random()*3*(kind===2?1.6:1),Math.sin(a)*sp,.4+Math.random()*.6); }
  },110);
  if(kind===2) pop(evolved?`大成功！变成「${swordName(sw)}」`:`大成功！Lv${before}→Lv${sw.lv}`,'gold');
  else if(kind===1) pop(evolved?`成功！进化成「${swordName(sw)}」`:`成功！Lv${sw.lv}`,'ok');
  else pop(`失败 · 损坏 +${add}`,'bad');
  if(kind===0&&forge.dmg>=BREAK_AT) toast('损坏到 60 了！再敲一下刀就会碎，快收刀','bad');
  drawBoard(); updMini(); updHUD();
  if(sw.lv>=30){ forge.phase='done'; if(!S.won){ S.won=true; save(); } setTimeout(()=>showForgeResult(false),1000); }
}
function shatter(){
  const sw=forge.sw; forge.phase='done';
  S.swords=S.swords.filter(s=>s!==sw); save();
  $('#mini').hidden=true;

/* ================= 存档：本机 + 云存档 + 存档码 ================= */
const SLOTS=['1','2','3'];
const cloud={ready:false,db:null,uid:null,dl:null,busy:{},pending:{},meta:{},lastAuto:0,err:''};
const localSlotKey=n=>KEY+'-slot'+n;
function validState(o){ return !!(o&&o.v===1&&Array.isArray(o.swords)&&typeof o.day==='number'&&typeof o.gold==='number'&&typeof o.hearts==='number'); }
function readLocalSlot(n){ try{ const t=localStorage.getItem(localSlotKey(n)); const o=t&&JSON.parse(t); return validState(o)?o:null; }catch(e){ return null; } }
function newestAuto(){ const a=loadSave(), b=cloud.meta.auto; if(validState(a)&&validState(b)) return (b.t||0)>(a.t||0)?b:a; return validState(a)?a:(validState(b)?b:null); }
function useState(o,quiet){
  S=JSON.parse(JSON.stringify(o));
  const mx=S.swords.reduce((m,x)=>Math.max(m,x.id||0),0); S.uid=Math.max(S.uid||1,mx+1);
  S.codex=S.codex||{}; S.stock=S.stock||[]; if(!S.maxHearts) S.maxHearts=3;
  afterLoad(); save(); if(!quiet) goTo('home');
}
const cref=n=>cloud.db.collection('data/users/'+cloud.uid).doc(n==='auto'?'auto':'slot'+n);
async function cloudWrite(n,body){
  if(!cloud.ready) return false;
  if(cloud.busy[n]){ cloud.pending[n]=body; return true; }
  cloud.busy[n]=true; let ok=false;
  try{ await cref(n).set(body); ok=true; }
  catch(e){
    if(e&&e.code==='unavailable'){ await new Promise(r=>setTimeout(r,800+Math.random()*800)); try{ await cref(n).set(body); ok=true; }catch(_){} }
    else if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')){ cloud.ready=false; cloud.err='这个链接只能看，不能往云端存档，进度只存在这个浏览器里'; updSaveTab(); }
    else if(e&&e.code==='quota_exceeded'){ cloud.err='云存档空间满了'; }
  }
  finally{ cloud.busy[n]=false; if(ok) cloud.meta[n]=body; const nx=cloud.pending[n]; if(nx){ delete cloud.pending[n]; cloudWrite(n,nx); } }
  return ok;
}
let autoTimer=null;
function scheduleAuto(){ if(!cloud.ready) return; clearTimeout(autoTimer); autoTimer=setTimeout(flushAuto,2500); }
function flushAuto(){ clearTimeout(autoTimer); autoTimer=null; if(!cloud.ready||!S) return; if(S.t&&S.t===cloud.lastAuto) return; cloud.lastAuto=S.t; cloudWrite('auto',JSON.parse(JSON.stringify(S))).then(ok=>{ if(ok) savedChip(true); }); }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushAuto(); });
window.addEventListener('pagehide',flushAuto);
async function initCloud(){
  try{
    if(!window.claude||typeof window.claude.use!=='function'){ cloud.err='进度自动存在这个浏览器里。换手机或换电脑玩，请用存档码。'; updSaveTab(); setStartCloud(); return; }
    const [db,user,dl]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads')]);
    cloud.dl=dl||null;
    const uid=db&&user?await user.id():null;
    if(!db||!uid){ cloud.err='没有登录或没有权限，进度只存在这个浏览器里'; updSaveTab(); setStartCloud(); return; }
    cloud.db=db; cloud.uid=uid; cloud.ready=true;
    const snaps=await Promise.all(['auto',...SLOTS].map(n=>cref(n).get().then(s=>[n,s.exists?s.data():null]).catch(()=>[n,null])));
    snaps.forEach(([n,d])=>{ if(validState(d)) cloud.meta[n]=JSON.parse(JSON.stringify(d)); });
    updSaveTab(); setStartCloud();
    // 开始界面还开着：云端进度更新就换成云端的
    const ca=cloud.meta.auto;
    if(validState(ca)&&(ca.t||0)>(S.t||0)&&(S.t||0)===bootT&&!forge){
      useState(ca,true); toast(`已自动读取云存档：第 ${S.day} 天`,'good');
      if(!$('#ov').hidden&&$('#bNew')) hideOv();
    } else if(!$('#ov').hidden&&$('#bNew')&&!$('#ovCard').textContent.includes('烧光')&&!$('#ovCard').textContent.includes('神刀出世')) showStart();
    if(S) savedChip(!!cloud.meta.auto);
    if(!$('#panel').hidden&&$('#pTitle').textContent==='存档') openSaves();
    if(S&&!cloud.meta.auto) scheduleAuto();
  }catch(e){ cloud.ready=false; cloud.err='云存档连不上，进度只存在这个浏览器里'; updSaveTab(); setStartCloud(); }
}
function setStartCloud(){ const el=$('#startCloud'); if(el) el.textContent=cloud.ready?'云存档已连上：进度会存到你的账号里，换设备也能接着玩。':(cloud.err||'没有云存档，进度只存在这个浏览器里。记得用存档码备份。'); }
function updSaveTab(){ const t=$('#tSave'); if(t) t.textContent=cloud.ready?'云端':'本机'; }
function timeStr(t){ if(!t) return ''; const d=new Date(t), z=n=>String(n).padStart(2,'0'); return `${d.getMonth()+1}月${d.getDate()}日 ${z(d.getHours())}:${z(d.getMinutes())}`; }
function slotInfo(o){ return o?`<b>第 ${o.day} 天 · 金币 ${fmt(o.gold)}</b>最高 Lv${o.best||0} · 生命 ${o.hearts} · ${o.swords.length} 把刀 · ${timeStr(o.t)}`:'<b>空</b>还没有存过'; }
function slotData(n){ const a=readLocalSlot(n), b=cloud.meta[n]; if(a&&b) return (b.t||0)>=(a.t||0)?b:a; return a||b||null; }
async function slotSave(n){
  if(!SLOTS.includes(n)) return;
  save(); const body=JSON.parse(JSON.stringify(S));
  let local=false; try{ localStorage.setItem(localSlotKey(n),JSON.stringify(body)); local=true; }catch(e){}
  let up=false; if(cloud.ready) up=await cloudWrite(n,body);
  if(up) toast(`已存到存档位 ${n}（云端）`,'good'); else if(local) toast(`已存到存档位 ${n}（这个浏览器）`,'good'); else toast('存档失败了，请用下面的存档码备份','bad');
  SFX.coin(); openSaves();
}
function slotLoad(n){ const o=slotData(n); if(!o){ toast('这个存档位是空的','bad'); return; } useState(o); closePanel(); toast(`读取了存档位 ${n}：第 ${S.day} 天`,'good'); }
function makeCode(){ return 'DRAGONFORGE1:'+btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function readCode(c){ c=(c||'').trim(); const i=c.indexOf(':'); if(i<0||c.slice(0,i)!=='DRAGONFORGE1') throw new Error('bad'); return JSON.parse(decodeURIComponent(escape(atob(c.slice(i+1).replace(/\s+/g,''))))); }
function loadFromCode(c){ let o=null; try{ o=readCode(c); }catch(e){} if(!validState(o)){ toast('存档码不对，要整段复制过来，开头是 DRAGONFORGE1:','bad'); return; } useState(o); closePanel(); toast(`存档码读取成功：第 ${S.day} 天`,'good'); }
function copyCode(){ const ta=$('#codeOut'); if(!ta) return; const done=()=>toast('存档码复制好了，粘贴到备忘录里保存','good');
  try{ navigator.clipboard.writeText(ta.value).then(done,()=>{ ta.focus(); ta.select(); toast('请长按或按 Ctrl+C 复制选中的存档码'); }); }catch(e){ ta.focus(); ta.select(); toast('请长按或按 Ctrl+C 复制选中的存档码'); } }
async function downloadCode(){ if(!cloud.dl){ try{ const u=URL.createObjectURL(new Blob([makeCode()],{type:'text/plain'})); const a=document.createElement('a'); a.href=u; a.download=`恶龙锻刀铺-第${S.day}天.txt`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); toast('存档文件下载好了','good'); }catch(e){ toast('下载不了，请用复制存档码','bad'); } return; } try{ await cloud.dl.save({filename:`恶龙锻刀铺-第${S.day}天.txt`,data:makeCode()}); toast('存档文件保存好了','good'); }catch(e){ if(e&&e.code!=='declined') toast('这里不能保存文件，请用复制存档码','bad'); } }
function openSaves(opt){
  opt=opt||{};
  let h=`<div class="savestat ${cloud.ready?'on':''}"><span class="dot"></span><span>${cloud.ready?'云存档已连上：进度存在你的账号里，换手机、换电脑都能接着玩。':(cloud.err||'进度自动存在这个浏览器里。')}</span></div>`;
  const au=newestAuto();
  h+=`<p class="note"><b>自动存档</b>：每做一件事都会自动保存${cloud.ready?'，并同步到云端':''}。现在是第 ${S.day} 天${au&&au.t?`，上次保存 ${timeStr(au.t)}`:''}。想留住某一天的进度，就存到下面的存档位。</p>`;
  h+=`<div class="sec">存档位</div>`;
  SLOTS.forEach(n=>{ const o=slotData(n);

      ${o?(ask?`<button class="btn red" data-act="slotLoad" data-id="${n}">确定读取</button><button class="btn ghost" data-act="saves">算了</button>`:`<button class="btn ghost" data-act="slotLoadAsk" data-id="${n}">读取</button>`):''}
    </div></div>`; });
  if(opt.ask) h+=`<p class="note">读取后，现在的进度会被换掉。舍不得的话，先把现在的进度存到另一个空位。</p>`;
  h+=`<div class="sec">存档码（备份用）</div>
    <p class="note">把整段存档码复制下来，粘贴到备忘录或微信里。以后在任何地方都能用它恢复进度。</p>`;
  if(opt.code) h+=`<textarea class="code" id="codeOut" readonly>${makeCode()}</textarea><div class="row"><button class="btn" data-act="codeCopy">复制存档码</button><button class="btn ghost" data-act="codeFile">存成文件</button></div>`;
  else h+=`<div class="row"><button class="btn" data-act="codeMake">生成存档码</button></div>`;
  h+=`<textarea class="code" id="codeIn" placeholder="在这里粘贴存档码，开头是 DRAGONFORGE1:"></textarea>
    <div class="row"><button class="btn ghost" data-act="codeLoad">用存档码读取</button><label class="btn ghost filebtn">读取存档文件<input type="file" id="codeFileIn" accept=".txt,text/plain"></label></div>`;
  openPanel('存档',h);
  const fi=$('#codeFileIn'); if(fi) fi.addEventListener('change',()=>{ const f=fi.files&&fi.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>loadFromCode(String(r.result||'')); r.readAsText(f); });
}

  <div class="row">${sv?`<button class="btn big" id="bCont">继续（第 ${sv.day} 天）</button>`:''}<button class="btn ${sv?'ghost':''} big" id="bNew">开始新游戏</button><button class="btn ghost big" id="bLoad">读取存档</button></div>
  <p class="keys" id="startCloud">${cloud.ready?'云存档已连上：进度会存到你的账号里，换设备也能接着玩。':'进度会自动存在这个浏览器里，下次打开直接接着玩。'}</p>`);
  if(sv) $('#bCont').onclick=()=>{ audio(); useState(sv,true); hideOv(); toast(`欢迎回来，第 ${S.day} 天`); };
  $('#bLoad').onclick=()=>{ audio(); if(sv) useState(sv,true); else afterLoad(); hideOv(); openSaves(); };
  let sure=false;
  $('#bNew').onclick=()=>{ audio(); if(sv&&!sure){ sure=true; $('#bNew').textContent='确定？旧进度会被盖掉（可以先去「读取存档」存到存档位）'; return; } newGame(); afterLoad(); hideOv(); setTimeout(()=>{ goTo('dragon',()=>{ jawT=1; SFX.roar(); setTimeout(()=>jawT=0,900); toast(`恶龙：给我一把值 ${fmt(S.demand.value)} 的刀！三天之内！`,'bad'); setTimeout(()=>goTo('furnace',()=>openForgePicker()),1800); }); },300); };
}
function showWin(){
  SFX.win();
  const best=S.swords.slice().sort((a,b)=>b.lv-a.lv)[0];
  showOv(`<h1>神刀出世</h1><p class="lead">你锻出了 Lv30 的「${best?swordName(best):'神刀'}」，价值 <b style="color:var(--gold)">990,099亿</b>！连恶龙都不敢再来要刀了。</p>
   <p class="keys">用了 ${S.day} 天 · 锻了 ${S.forges} 次 · 献给恶龙 ${S.given} 把刀 · 图鉴 ${codexCount()}/${KINDS}</p>
   <div class="row"><button class="btn big" id="bGo">接着玩，集齐 ${KINDS} 种</button><button class="btn ghost big" id="bNew2">重新开始</button></div>`);
  $('#bGo').onclick=()=>hideOv();
  $('#bNew2').onclick=()=>{ newGame(); afterLoad(); hideOv(); goTo('home'); };
}
function showLose(){
  showOv(`<h1>铺子烧光了</h1><p class="lead">恶龙三次没拿到刀，一把火把锻刀铺烧成了灰。</p>
   <p class="keys">撑了 ${S.day} 天 · 锻了 ${S.forges} 次 · 献给恶龙 ${S.given} 把刀 · 最高 Lv${S.best}</p>
   <div class="row"><button class="btn big" id="bNew3">重新开一家铺子</button></div>`);
  $('#bNew3').onclick=()=>{ audio(); newGame(); afterLoad(); hideOv(); goTo('home'); };
}
function afterLoad(){
  if(forge) endForge();
  if(isMerchantDay()&&S.stockDay!==S.day) genStock();
  $('#panel').hidden=true; setLocked(false); updHUD(); refreshRack();
}

/* ================= 主循环 ================= */
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov=w/h<.8?84:68; camera.updateProjectionMatrix(); }
window.addEventListener('resize',resize); resize();
let T=0,last=performance.now(),emberAcc=0,hoverAcc=0;
const fwd=new THREE.Vector3(), rgt=new THREE.Vector3(), tmpV=new THREE.Vector3();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; T+=dt;
  // 相机
  if(tw){ tw.t+=dt/tw.dur; const k=ease(Math.min(1,tw.t)); camPos.lerpVectors(tw.fp,tw.tp,k); yaw=tw.fy+(tw.ty-tw.fy)*k; pitch=tw.fx+(tw.tx-tw.fx)*k; if(tw.t>=1){ const cb=tw.cb; tw=null; if(cb) cb(); } }
  else if(!locked&&$('#ov').hidden){
    let mx=0,mz=0; if(keys.w||keys.arrowup) mz+=1; if(keys.s||keys.arrowdown) mz-=1; if(keys.a||keys.arrowleft) mx-=1; if(keys.d||keys.arrowright) mx+=1;
    if(keys.q) yaw+=dt*1.6; if(keys.e) yaw-=dt*1.6;
    if(mx||mz){ fwd.set(-Math.sin(yaw),0,-Math.cos(yaw)); rgt.set(Math.cos(yaw),0,-Math.sin(yaw)); camPos.addScaledVector(fwd,mz*3.2*dt).addScaledVector(rgt,mx*3.2*dt); camPos.x=clamp(camPos.x,-6.3,6.2); camPos.z=clamp(camPos.z,-4.3,4.4); }
  }
  if(!tw&&$('#ov').hidden&&!locked) { /* 空闲时轻微呼吸 */ }
  camera.position.copy(camPos); camera.position.y+=Math.sin(T*1.6)*.008;
  camera.rotation.set(pitch,yaw,0);
  // 锤子
  let sw=0; if(hamSwing>=0){ hamSwing+=dt/.28; if(hamSwing>=1) hamSwing=-1; else sw=Math.sin(hamSwing*Math.PI); }
  hamPivot.rotation.x=-sw*1.5; hammerG.position.y=-.42+Math.sin(T*1.6)*.006;
  const holdingNow=!forge&&handG.children.length>0; hammerG.visible=!holdingNow; handG.visible=!forge;
  handG.position.y=Math.sin(T*1.6)*.01;
  [rackSwords,groundG,handG].forEach(G=>G.children.forEach(c=>spinItem(c,dt)));
  // 火
  const heating=forge&&forge.phase==='heat';
  fireL.intensity=2.6+Math.sin(T*13)*.3+Math.sin(T*7.3)*.25+(heating?forge.temp*1.6:0);
  mouth.material.color.setScalar(.85+Math.sin(T*9)*.08+Math.sin(T*5.1)*.07);
  flames.forEach(f=>{ const s=.8+Math.sin(T*8+f.userData.ph)*.25+Math.sin(T*13+f.userData.ph*2)*.15+(heating?.4:0); f.scale.set(1,s,1); f.position.y=.62+s*.22; });
  emberAcc+=dt*(heating?30:9); while(emberAcc>1){ emberAcc--; emit(embers,-4.6+(Math.random()-.5)*1.1,1.2,-2.95,(Math.random()-.5)*.4,.6+Math.random()*.9,.2+Math.random()*.4,1.4+Math.random()); }
  // 锻造
  if(forge){
    if(forge.phase==='heat'){ forge.temp+=dt*.75; if(forge.temp>=1&&!forge.heated){ forge.heated=true; heated(); } }
    else if(forge.phase==='hammer'){ forge.temp=Math.max(.3,forge.temp-dt*.05); }
    else if(forge.phase==='result'){ forge.temp=Math.max(0,forge.temp-dt*.35); }
    if(forge.cool>0) forge.cool-=dt;
    if(forgeMesh){ setHeat(forgeMesh,forge.temp); spinItem(forgeMesh,dt); }
  }
  // 恶龙
  dragon.position.y=Math.sin(T*.8)*.12;
  const ty=clamp(Math.atan2(camPos.x-2.75,camPos.z+8.6),-.5,.5); dHead.rotation.y+=(ty-dHead.rotation.y)*Math.min(1,dt*2);
  const tp=clamp(-Math.atan2(camPos.y-3.0,camPos.z+8.6)*.6,-.35,.35); dHead.rotation.x+=(tp-dHead.rotation.x)*Math.min(1,dt*2);
  jawV+=(jawT-jawV)*Math.min(1,dt*8); jaw.rotation.x=jawV*.6+Math.sin(T*1.3)*.03;
  wings.forEach((w,i)=>{ w.rotation.z=(i?-1:1)*Math.sin(T*.9)*.08; });
  const urgent=S&&S.demand&&S.demand.due<=S.day;
  eyeMat.color.setHex(urgent||breathT>0?0xff3a1a:0xffc414); eyeL.intensity=.8+Math.sin(T*(urgent?6:2))*.3;
  if(breathT>0){ breathT-=dt; if(breathT<1.2){ const mw=new THREE.Vector3(); jaw.getWorldPosition(mw); mw.z+=1.6; for(let i=0;i<12;i++) emit(breath,mw.x+(Math.random()-.5)*.3,mw.y+(Math.random()-.5)*.3,mw.z,(Math.random()-.5)*2.5,(Math.random()-.5)*1.5,7+Math.random()*4,.9+Math.random()*.3); } }
  // 飞刀
  if(flying){ flying.t+=dt/.9; const k=Math.min(1,flying.t); tmpV.lerpVectors(flying.from,flying.to,k); tmpV.y+=Math.sin(k*Math.PI)*.8; flying.m.position.copy(tmpV); flying.m.rotation.set(k*9,k*4,0); flying.m.scale.setScalar(1-k*.4); if(k>=1){ const f=flying; flying=null; f.done(); } }
  stepPS(sparks,dt); stepPS(shards,dt); stepPS(embers,dt); stepPS(breath,dt);
  // 悬停提示
  hoverAcc+=dt;
  if(hoverAcc>.08){ hoverAcc=0; const hint=$('#hint');
    if(mouse.has&&!pDown&&!locked&&$('#ov').hidden){ const u=pick(mouse.x,mouse.y); if(u){ const hh=heldSword(); hint.textContent=hh&&u.station==='rack'&&!u.swordId?'放回刀架':hh&&(u.station==='furnace'||u.station==='anvil')?`把「${swordName(hh)}」拿去锻`:u.label; hint.style.left=mouse.x+'px'; hint.style.top=mouse.y+'px'; hint.hidden=false; canvas.style.cursor='pointer'; } else { hint.hidden=true; canvas.style.cursor='grab'; } }
    else hint.hidden=true; }
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
$('#miniBtn').addEventListener('click',()=>{ audio(); stopForge(); });

// 启动
S=loadSave()||null;
const hadSave=!!S;
if(!S){ newGame(true); }
afterLoad();
drawBoard();
camera.position.copy(camPos);
requestAnimationFrame(loop);
if(hadSave){ hideOv(); savedChip(false); setTimeout(()=>toast(`欢迎回来！已自动读取存档：第 ${S.day} 天`,'good'),300); }
else showStart();
bootT=S.t||0;
initCloud();
})();
</script>
</body>
